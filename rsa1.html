<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>RSA授業用ツール 完全版</title>
<style>
  body { font-family: sans-serif; padding: 20px; }
  input, textarea { margin: 5px; padding: 5px; }
  textarea { width: 300px; height: 60px; }
  button { margin: 10px 5px; padding: 8px; }
</style>
</head>
<body>

<h2>RSA暗号ツール（完全版）</h2>

<h3>鍵</h3>
n: <input type="number" id="n" value="35">
e: <input type="number" id="e" value="5">
d: <input type="number" id="d" value="5">

<hr>

<h3>① ローマ字 → 暗号化</h3>
入力（ローマ字）:<br>
<input id="plainText" placeholder="例: NEKO"><br>

<button onclick="encrypt()">暗号化</button>

<p>数字: <span id="numbers"></span></p>
<p>暗号: <span id="encrypted"></span></p>

<hr>

<h3>② 暗号 → 復号</h3>
暗号入力（カンマ区切り）:<br>
<textarea id="cipherInput" placeholder="例: 14,10,16,15"></textarea><br>

<button onclick="decrypt()">復号</button>

<p>復号（数字）: <span id="decrypted"></span></p>
<p>ローマ字: <span id="romaji"></span></p>

<script>
// A=1〜Z=26
function charToNum(c) {
  return c.charCodeAt(0) - 64;
}
function numToChar(n) {
  return String.fromCharCode(n + 64);
}

// 高速べき乗
function modPow(base, exp, mod) {
  let result = 1;
  base %= mod;
  while (exp > 0) {
    if (exp % 2 === 1) result = (result * base) % mod;
    base = (base * base) % mod;
    exp = Math.floor(exp / 2);
  }
  return result;
}

// 暗号化
function encrypt() {
  const n = Number(document.getElementById("n").value);
  const e = Number(document.getElementById("e").value);
  const text = document.getElementById("plainText").value.toUpperCase();

  let nums = [];
  let enc = [];

  for (let c of text) {
    if (c < 'A' || c > 'Z') continue;
    let num = charToNum(c);
    nums.push(num);
    enc.push(modPow(num, e, n));
  }

  document.getElementById("numbers").textContent = nums.join(", ");
  document.getElementById("encrypted").textContent = enc.join(", ");
}

// 復号
function decrypt() {
  const n = Number(document.getElementById("n").value);
  const d = Number(document.getElementById("d").value);
  const input = document.getElementById("cipherInput").value;

  let enc = input.split(",").map(x => Number(x.trim())).filter(x => !isNaN(x));
  let dec = [];
  let chars = [];

  for (let y of enc) {
    let x = modPow(y, d, n);
    dec.push(x);
    chars.push(numToChar(x));
  }

  document.getElementById("decrypted").textContent = dec.join(", ");
  document.getElementById("romaji").textContent = chars.join("");
}
</script>

</body>
</html>
