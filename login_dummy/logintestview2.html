<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【完全攻略】責任者専用ポータルサイト</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #faf5ff; /* 高級感のある薄紫 */
            color: #333;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            position: relative;
        }
        header {
            background-color: #0f172a;
            color: #ffffff;
            padding: 30px 20px;
            text-align: center;
            border-bottom: 5px solid #eab308; /* ゴールドライン */
        }
        /* レインボー＆ゴールドの超お祝いバナー */
        .congrats-banner {
            background: linear-gradient(45deg, #ff007f, #ffae00, #00bfff, #7b1fa2);
            background-size: 300% 300%;
            animation: rainbow 5s ease infinite;
            color: white;
            padding: 22px;
            text-align: center;
            font-weight: bold;
            font-size: 1.6rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.4);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        @keyframes rainbow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 35px;
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(123, 31, 162, 0.1);
            position: relative;
            z-index: 10;
            border: 2px solid #f3e8ff;
        }
        h2 {
            color: #6b21a8;
            border-left: 6px solid #a855f7;
            padding-left: 12px;
            font-size: 1.6rem;
        }
        .info-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .info-table th, .info-table td {
            border: 1px solid #e9d5ff;
            padding: 14px;
            text-align: left;
        }
        .info-table th {
            background-color: #fdf4ff;
            width: 30%;
            color: #581c87;
        }
        .gold-badge {
            background-color: #fef08a;
            color: #854d0e;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
            display: inline-block;
            margin-left: 10px;
        }
        footer {
            margin-top: 100px;
            background-color: #0f172a;
            color: #94a3b8;
            text-align: center;
            padding: 15px;
            font-size: 0.8rem;
        }

        /* 🎉 豪華な紙吹雪＆ゴールドスター */
        .confetti-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden; pointer-events: none;
            z-index: 1;
        }
        .confetti {
            position: absolute; width: 12px; height: 12px;
            animation: drop 2.5s infinite linear;
        }
        .confetti:nth-child(1) { background-color: #ffd700; --x: 0.15; animation-delay: 0s; }
        .confetti:nth-child(2) { background-color: #ff69b4; --x: 0.35; animation-delay: 0.4s; }
        .confetti:nth-child(3) { background-color: #00ffff; --x: 0.50; animation-delay: 0.8s; }
        .confetti:nth-child(4) { background-color: #ff4500; --x: 0.70; animation-delay: 0.2s; }
        .confetti:nth-child(5) { background-color: #da70d6; --x: 0.85; animation-delay: 0.6s; }
        
        @keyframes drop {
            0% { transform: translateY(-20px) rotate(0deg) scale(1); opacity: 1; left: calc(10% + 80% * var(--x)); }
            90% { opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg) scale(0.7); opacity: 0; left: calc(10% + 80% * var(--x)); }
        }
    </style>
</head>
<body>

    <div class="confetti-container">
        <div class="confetti"></div>
        <div class="confetti"></div>
        <div class="confetti"></div>
        <div class="confetti"></div>
        <div class="confetti"></div>
    </div>

    <div class="congrats-banner">
        ✨ 👑 PERFECT!! 最高管理者・責任者権限の奪取に成功しました！ 👑 ✨
    </div>

    <header>
        <h1>責任者専用マイページ</h1>
        <p>ようこそ、最高管理者（ID: soyokaze.takeuti@.com ）さん</p>
    </header>

    <div class="container">
        <h2>👑 完全攻略（ALL CLEAR）</h2>
        <p>おめでとうございます！すべての仕掛けを見破り、ネットワークへの接続が承認されました。</p>
        
        <table class="info-table">
            <tr>
                <th>現在のステータス</th>
                <td><span style="color: #a855f7; font-weight: bold;">● 最高責任者（フルアクセス許可）</span><span class="gold-badge">管理者</span></td>
            </tr>
            <tr>
                <th>所属グループ</th>
                <td>運営・システム管理責任者</td>
            </tr>
            <tr>
                <th>次回の活動予定</th>
                <td>2026年6月15日 13:00〜 定例ミーティング</td>
            </tr>
            <tr>
                <th>共有情報</th>
                <td>全システムの閲覧・編集権限が有効化されています。</td>
            </tr>
        </table>
    </div>

    <footer></footer>

</body>
</html>
