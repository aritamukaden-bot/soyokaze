<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログインページ</title>
    <style>
        /* 全体のレイアウト調整 */
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* ログインボックスのデザイン */
        .login-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 380px;
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            margin-bottom: 24px;
            color: #333333;
        }

        /* 入力フォームのスタイル */
        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            color: #666666;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
        }

        /* ボタンのスタイル */
        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .login-btn:hover {
            background-color: #0056b3;
        }

        /* エラーメッセージ用のスタイル */
        .error-message {
            margin-top: 16px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            min-height: 20px;
        }
    </style>
</head>
<body>

<div class="login-container">
    <h2>団体員ログイン</h2>
    <form id="loginForm">
        <div class="input-group">
            <label for="userId">ID</label>
            <input type="email" id="userId" placeholder="メールアドレス" required>
        </div>
        <div class="input-group">
            <label for="password">パスワード</label>
            <input type="password" id="password" placeholder="パスワードを入力" required>
        </div>
        <button type="submit" class="login-btn">ログイン</button>
    </form>
    <div id="errorMessage" class="error-message"></div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', function(event) {
        // 通常のページ遷移（リロード）をキャンセル
        event.preventDefault();

        // 画面に入力された値を取得
        const inputId = document.getElementById('userId').value;
        const inputPass = document.getElementById('password').value;
        const errorDiv = document.getElementById('errorMessage');

        // ----------------------------------------------------\
        // 【設定】正しいIDとパスワード
        // ----------------------------------------------------\
        const correctId = "soyokaze@soyosoyomail.com"; 
        const correctPass = "soyokaze0815";
        // ----------------------------------------------------\

        // エラー色を初期化（基本は赤）
        errorDiv.style.color = "#dc3545";

        // 条件判定：IDもパスワードも両方違う場合
        if (inputId !== correctId && inputPass !== correctPass) {
            errorDiv.textContent = "IDとパスワードが違います";
        } 
        // 条件判定：IDだけが違う場合
        else if (inputId !== correctId) {
            errorDiv.textContent = "IDが違います";
        } 
        // 条件判定：パスワードだけが違う場合
        else if (inputPass !== correctPass) {
            errorDiv.textContent = "パスワードが違います";
        } 
        // すべて一致した場合（ログイン成功）
        else {
            errorDiv.style.color = "#28a745"; // 文字色を緑に
            errorDiv.textContent = "ログインに成功しました！";
            
            alert("ログイン成功！");
            
            // ログイン成功後のマイページ（モダンレイアウト版）へ遷移
            window.location.href = "./testview.html";
        }
    });
</script>

</body>
</html>
